name: Build executables
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix: { os: [windows-latest, ubuntu-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Build desktop executable
        shell: bash
        env: { LOCALCAM_BUILD: "${{ github.run_number }}" }
        run: python -m pip install -r pc-client/requirements.txt pyinstaller && bash scripts/build_desktop.sh
      - uses: actions/upload-artifact@v4
        with: { name: "LocalCam-desktop-${{ matrix.os }}", path: dist/* }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.3.1" }
      - name: Build APK
        env: { LOCALCAM_BUILD: "${{ github.run_number }}" }
        run: bash scripts/build_android.sh
      - uses: actions/upload-artifact@v4
        with: { name: LocalCam-android-apk, path: dist/LocalCam.apk }
  release:
    if: github.ref == 'refs/heads/main'
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - name: Collect files
        run: |
          mkdir rel
          cp out/LocalCam-android-apk/LocalCam.apk rel/LocalCam.apk
          cp out/LocalCam-desktop-windows-latest/LocalCam.exe rel/LocalCam.exe
          cp out/LocalCam-desktop-macos-latest/LocalCam rel/LocalCam-macos || true
          cp out/LocalCam-desktop-ubuntu-latest/LocalCam rel/LocalCam-linux || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: LocalCam latest build
          files: rel/*
